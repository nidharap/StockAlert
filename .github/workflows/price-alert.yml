name: 6098 real-time price alert

on:
  schedule:
    # GitHub cron is UTC (JST = UTC+9). Each run starts a bit before a TSE session and
    # the script itself fires alerts exactly on every 5-minute mark until the session ends.
    - cron: "37 23 * * 0-4"   # 08:37 JST Mon-Fri -> morning session 09:00-11:30
    - cron: "52 23 * * 0-4"   # 08:52 JST backup in case GitHub drops the run above
    - cron: "7 3 * * 1-5"     # 12:07 JST Mon-Fri -> afternoon session 12:30-15:30
    - cron: "22 3 * * 1-5"    # 12:22 JST backup
  workflow_dispatch: # "Run workflow" button: sends one alert now, then covers the session if one is on

concurrency:
  group: price-alert       # only one run at a time; a backup that finds its session done just exits
  cancel-in-progress: false

permissions:
  actions: write   # lets the job switch itself off after END_DATE
  contents: read

env:
  END_DATE: "2026-12-02"   # last Tokyo date to send alerts; the next run switches the workflow off
  CODE: "6098"
  INTERVAL_MIN: "5"
  # ALERT_ABOVE: "18000"   # optional: urgent alert at/above this price
  # ALERT_BELOW: "16500"   # optional: urgent alert at/below this price

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Check end date
        id: expiry
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if [[ "$today" > "$END_DATE" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: End date passed - notify and switch off
        if: steps.expiry.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: $CODE alerts ended" \
            -d "End date $END_DATE passed. The workflow has switched itself off." \
            "https://ntfy.sh/$NTFY_TOPIC"
          gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY"

      - name: Send alerts
        if: steps.expiry.outputs.expired != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -u price_alert.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}
